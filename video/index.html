<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F1EAD9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-floor"
        class="scene"
        data-composition-id="02-floor"
        data-composition-src="compositions/frames/02-floor.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-wire"
        class="scene"
        data-composition-id="03-wire"
        data-composition-src="compositions/frames/03-wire.html"
        data-start="9"
        data-duration="10"
        data-track-index="0"
      ></div>

      <div
        id="el-04-settled"
        class="scene"
        data-composition-id="04-settled"
        data-composition-src="compositions/frames/04-settled.html"
        data-start="19"
        data-duration="8.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-end"
        class="scene"
        data-composition-id="05-end"
        data-composition-src="compositions/frames/05-end.html"
        data-start="27"
        data-duration="3"
        data-track-index="0"
      ></div>

      <video id="el-02-floor-video-1" src="assets/first-load.mp4" preload="auto" muted playsinline
        class="clip"
        style="position:absolute;left:382px;top:136px;width:1096px;height:685px;object-fit:cover"
        data-start="4"
        data-duration="5"
        data-track-index="2001"
      ></video>

      <video id="el-03-wire-video-2" src="assets/wire-a.mp4" preload="auto" muted playsinline
        class="clip"
        style="position:absolute;left:1102px;top:134px;width:720px;height:746px;object-fit:cover"
        data-start="9"
        data-duration="10"
        data-track-index="3001"
      ></video>

      <video id="el-04-settled-video-3" src="assets/wire-b.mp4" preload="auto" muted playsinline
        class="clip"
        style="position:absolute;left:124px;top:234px;width:896px;height:560px;object-fit:cover"
        data-start="19.45"
        data-duration="7.55"
        data-track-index="4001"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-floor", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-04-settled", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-05-end", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
