<script>
  (function () {
    // chip column anchors — thirds of the footage area, relative to the window box
    gsap.set("#f02-chip-lot",     { x: 565, xPercent: -50 });
    gsap.set("#f02-chip-console", { x: 930, xPercent: -50 });
    gsap.set("#f02-chip-ledger",  { x: 1295, xPercent: -50 });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* Scene 1 (0.0–1.2s) — the framed terminal lands center.
       The footage itself is already live (hoisted clip); the lot-card
       chrome scales in around it, topbar draws above. */
    tl.fromTo("#f02-window",
      { scale: 0.93, y: 26, autoAlpha: 0 },
      { scale: 1, y: 0, autoAlpha: 1, duration: 0.9, ease: "power3.out" }, 0.05);
    tl.fromTo(".f02-top-label",
      { y: -8, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, duration: 0.55, ease: "power2.out" }, 0.15);
    tl.fromTo(".f02-top-count",
      { y: -8, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, duration: 0.55, ease: "power2.out" }, 0.25);
    tl.fromTo("#f02-toprule",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.inOut", transformOrigin: "left center" }, 0.2);

    /* Scene 2 (1.2–3.0s) — three mono chips pin in sequence:

          { y: -16, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.7)" }, at);
      });

    /* Scene 3 (3.0–5.0s) — the caption settles under the frame, word by word,
       then its hairline seals. Hold to end. */
    tl.fromTo("#f02-caption .f02-cap-word",
      { y: 10, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 3.0);
    tl.fromTo("#f02-caprule",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.6, ease: "power2.inOut", transformOrigin: "center center" }, 3.95);

    // full-span anchor — the timeline covers the whole 5s window

    window.__timelines["02-floor"] = tl;
